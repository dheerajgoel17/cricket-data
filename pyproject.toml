[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-data"
version = "0.1.0"
description = "Free, self-updating open cricket dataset: daily Cricsheet ingest, per-player performance, provisional-data reconciliation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cricket Data maintainers", email = "dheerajgoeldsuperdude@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# value-bet pipeline (src/value_bets, docs/VALUE_BETS.md); the dataset itself stays dependency-free
value-bets = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "rapidfuzz>=3.5"]

[project.scripts]
cricket-data = "cricket_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# value-bet pipeline: compact numeric code; closures are called immediately inside their loop
"src/value_bets/**" = ["E702", "B007", "B023"]
