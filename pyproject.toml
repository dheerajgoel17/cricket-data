[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cricket-data"
version = "0.1.0"
description = "Free, self-updating open cricket dataset: daily Cricsheet ingest, per-player performance, provisional-data reconciliation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cricket Data maintainers", email = "dheerajgoeldsuperdude@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
bot = ["anthropic>=1.0"]

[project.scripts]
cricket-data = "cricket_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
