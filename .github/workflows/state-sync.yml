name: Match state

# Writes the match-state table (Supabase): one row and one phase (upcoming / live / final) per match, read by /api/state. It reads the same source pages as /api/live,
# so it only needs the live-source secret. GitHub cron can slip by several minutes; the live feed (15 s) still wins in the browser while a match is on.
# Does nothing until SUPABASE_URL (variable) and SUPABASE_SERVICE_KEY (secret) exist.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: state-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      LIVE_SOURCE_BASE: ${{ secrets.LIVE_SOURCE_BASE }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Write the match state
        working-directory: site
        run: node scripts/state-sync.mjs
