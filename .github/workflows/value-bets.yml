name: Value bets

# Hourly, round the clock (minute 30): pull free odds (Exchange S, Book A via Feed P), price player props
# against the cricket-data history and commit ONLY the small outputs under value_bets/out + dedupe state.
# Independent of the data workflows (own concurrency group, touches no files under data/).
# Each run also adds the results of finished matches to value_bets/archive (read from the site's live route; see docs/PROJECT_GUIDE.md 5.4c).
# And it writes value_bets/out/fancy_alerts.json: the pre-match fancy lines whose history-based edge is clearly positive, scored by the site's own engine on freshly built site data
# (site/scripts/fancy-alerts.mjs; the Telegram Worker posts them, docs/OPERATIONS.md). That step is optional: if it fails the pipeline's own outputs are still committed.
# Weekly (Sun 07:00 UTC) or on demand with refit=true: re-run the prop backtest (incl. the weather study, topping up
# the Open-Meteo cache in value_bets/mappings) and refit state/prop_model.json.
on:
  schedule:
    - cron: "30 * * * *"
    - cron: "0 7 * * 0"
  pull_request:  # dry run on PRs that touch the pipeline (proves the sources work from GitHub's runners; never commits)
    paths: ["src/value_bets/**", "value_bets/**", ".github/workflows/value-bets.yml", "site/scripts/fancy-alerts.mjs", "site/packages/engine/fancy-edge.js"]
  workflow_dispatch:
    inputs:
      refit:
        description: "Re-run the prop backtest and refit the model (~4 min)"
        type: boolean
        default: false
      commit:
        description: "Commit outputs (turn off for a dry run on a branch)"
        type: boolean
        default: true

# Hosts are deployment configuration (repository secrets, masked in logs), never code. See docs/OPERATIONS.md.
env:
  LIVE_SOURCE_BASE: ${{ secrets.LIVE_SOURCE_BASE }}
  LIVE_SITEMAP_DIR: ${{ secrets.LIVE_SITEMAP_DIR }}
  IMG_CDN_BASE: ${{ secrets.IMG_CDN_BASE }}
  VITE_IMG_CDN: ${{ secrets.IMG_CDN_BASE }}
  BASE_DATA_URL: ${{ secrets.BASE_DATA_URL }}
  PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
  EXCHANGE_API_URL: ${{ secrets.EXCHANGE_API_URL }}
  FEEDK_URL: ${{ secrets.FEEDK_URL }}
  FEEDK_BOOKS: ${{ secrets.FEEDK_BOOKS }}
  FEEDE_BOOKS: ${{ secrets.FEEDE_BOOKS }}
  FEEDF_NAME: ${{ secrets.FEEDF_NAME }}
  FEEDF_API: ${{ secrets.FEEDF_API }}
  FEEDF_PREMIUM: ${{ secrets.FEEDF_PREMIUM }}
  FEEDF_TENANT: ${{ secrets.FEEDF_TENANT }}
  FEEDG_NAME: ${{ secrets.FEEDG_NAME }}
  FEEDG_API: ${{ secrets.FEEDG_API }}
  FEEDG_RELAY: ${{ secrets.FEEDG_RELAY }}
  FEEDG_RELAY_KEY: ${{ secrets.FEEDG_RELAY_KEY }}
  FEEDH_URL: ${{ secrets.FEEDH_URL }}
  FEEDH_NAME: ${{ secrets.FEEDH_NAME }}
  FEEDH_RELAY: ${{ secrets.FEEDH_RELAY }}
  FEEDH_RELAY_KEY: ${{ secrets.FEEDH_RELAY_KEY }}

permissions:
  contents: write

concurrency:
  group: value-bets
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CV_SOURCES: ${{ vars.CV_SOURCES }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      BETFAIR_APP_KEY: ${{ secrets.BETFAIR_APP_KEY }}
      BETFAIR_USERNAME: ${{ secrets.BETFAIR_USERNAME }}
      BETFAIR_PASSWORD: ${{ secrets.BETFAIR_PASSWORD }}
      BETFAIR_SSO_URL: ${{ secrets.BETFAIR_SSO_URL }}
      BETFAIR_API_URL: ${{ secrets.BETFAIR_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[value-bets]"
      - name: Refit prop model (weekly / on demand)
        if: github.event.schedule == '0 7 * * 0' || inputs.refit
        env:
          CV_WEATHER_FETCH: "1"  # top up the Open-Meteo venue/day weather cache for new matches (free, no key)
        run: python -m value_bets.backtest
      - name: Find value bets
        if: github.event.schedule != '0 7 * * 0'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          export CV_SNAPSHOTS="$RUNNER_TEMP/snapshots"
          timeout 600 python -m value_bets.pipeline | tee value_bets_run.log
          {
            echo '### Value bets'
            cat value_bets/out/value_bets_latest.md
          } >> "$GITHUB_STEP_SUMMARY"
          test ! -f value_bets/out/last_error.txt || { echo "::warning::pipeline error, see value_bets_run.log"; }
      - uses: actions/setup-node@v4
        if: github.event.schedule != '0 7 * * 0'
        with:
          node-version: "22"
      - name: Today's date (cache key for the daily-changing download)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore today's Base download
        id: dl
        if: github.event.schedule != '0 7 * * 0'
        uses: actions/cache/restore@v4
        with:
          path: .sitecache
          key: fancy-dl1-${{ steps.day.outputs.d }}  # not the Site workflow's key: that cache also holds the people register, which this one never downloads
      - name: Download Base ball-by-ball (once a day)
        if: github.event.schedule != '0 7 * * 0' && steps.dl.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p .sitecache
          curl -fsSL --retry 4 --retry-delay 20 -o .sitecache/all_json.zip.part "$BASE_DATA_URL/downloads/all_json.zip"
          mv .sitecache/all_json.zip.part .sitecache/all_json.zip
      - name: Keep today's Base download
        # saved only when the whole file arrived: a failed download must not be cached for the rest of the day
        if: github.event.schedule != '0 7 * * 0' && steps.dl.outputs.cache-hit != 'true' && hashFiles('.sitecache/all_json.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: .sitecache
          key: fancy-dl1-${{ steps.day.outputs.d }}
      - name: Fancy edge alerts (site data built, then scored by the site's engine)
        # the same data build the Site workflow runs (without photos), written outside the repository; the alert file is rewritten whole each run, and a failure leaves the last one in place
        if: github.event.schedule != '0 7 * * 0'
        continue-on-error: true
        run: |
          python -m cricket_site.build --zip .sitecache/all_json.zip --data data --out "$RUNNER_TEMP/site-data" --value-bets value_bets/out > "$RUNNER_TEMP/build.json"
          node site/scripts/fancy-alerts.mjs --data "$RUNNER_TEMP/site-data" --lines value_bets/out/book_lines.json --out value_bets/out/fancy_alerts.json
      - name: Store the results of finished matches in the archive
        # the site's live route settles every priced line of a finished match (ids through the identity table); this only writes those results into the match's archive file (added, never changed)
        if: github.event.schedule != '0 7 * * 0' && vars.SITE_URL != ''
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          DATA_WRAP_KEY: ${{ secrets.DATA_WRAP_KEY }}
        run: python -m value_bets.archive --results "${SITE_URL%/}/api/live"
      - name: Edge-bet ledger (fancy upsert + settle + summary)
        # internal Supabase edge_bets: every recommended model/fancy edge; flat 1u P&L; never shown on the site
        if: github.event.schedule != '0 7 * * 0'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m value_bets.ledger --upsert-fancy value_bets/out/fancy_alerts.json
          python -m value_bets.ledger --settle --summary
      - name: Commit outputs
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A value_bets/out value_bets/state value_bets/archive  # .gitignore keeps caches/snapshots out; the archive is never deleted
          git add -A value_bets/mappings/venue_geo.csv value_bets/mappings/venue_weather_daily.csv.gz
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -q -m "value-bets: $(TZ=Asia/Kolkata date '+%F %H:%M IST') [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((i * 10))
          done
          echo "::error::push failed after retries"; exit 1
      - name: Upload odds snapshots (rotated by artifact retention, not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odds-snapshots-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/snapshots/
            value_bets_run.log
          retention-days: 90  # the most GitHub allows; odds history is useful data, so keep it as long as possible
          if-no-files-found: ignore
