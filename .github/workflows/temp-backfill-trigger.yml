name: Test Backfill
on:
  push:
    branches:
      - cursor/scraper-workflow-0411

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . && playwright install chromium
      - run: cricket-data update --enable-scraper --backfill-batch-size 5 --provisional-days 7
        env:
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          RAPIDAPI_CRICKET_KEY: ${{ secrets.RAPIDAPI_CRICKET_KEY }}
      - run: |
          echo "=== Backfill Results ===" 
          cat data/state/backfill_queue.json | python3 -m json.tool | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-results
          path: |
            data/provisional/*.json
            data/state/backfill_queue.json
