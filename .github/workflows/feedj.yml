name: Feed J probe

# Dispatch only: pull Feed J's listing from a runner and print what comes back (status, a header sample, with plain urllib and with Chrome TLS).
# Nothing committed. A pull request never runs this (the repository is public).
# Set secrets FEEDJ_API, FEEDJ_BRAND, FEEDJ_ORIGIN and FEEDJ_NAME.
on:
  workflow_dispatch:

concurrency:
  group: feedj-probe
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEEDJ_API: ${{ secrets.FEEDJ_API }}
      FEEDJ_BRAND: ${{ secrets.FEEDJ_BRAND }}
      FEEDJ_ORIGIN: ${{ secrets.FEEDJ_ORIGIN }}
      FEEDJ_NAME: ${{ secrets.FEEDJ_NAME }}
      FEEDJ_RELAY: ${{ secrets.FEEDJ_RELAY }}
      FEEDJ_RELAY_KEY: ${{ secrets.FEEDJ_RELAY_KEY }}
      FEEDH_RELAY: ${{ secrets.FEEDH_RELAY }}
      FEEDH_RELAY_KEY: ${{ secrets.FEEDH_RELAY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[value-bets]"
      - name: Listing, plain and Chrome TLS
        run: |
          python - <<'PY' | tee "$GITHUB_STEP_SUMMARY"
          import os, urllib.request, urllib.error
          api, brand, origin = (os.environ[k] for k in ("FEEDJ_API", "FEEDJ_BRAND", "FEEDJ_ORIGIN"))
          url = f"{api}/v4/prematch/brand/{brand}/en-IN/0"
          h = {"User-Agent": "Mozilla/5.0 Chrome/131.0 Safari/537.36", "Origin": origin, "Referer": origin + "/"}
          try:
              r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=30)
              print("urllib", r.status, len(r.read()))
          except urllib.error.HTTPError as e:
              print("urllib", e.code, [(k, v) for k, v in e.headers.items() if k.lower() in ("server", "via", "x-cache", "content-type")], e.read()[:160])
          from curl_cffi import requests
          s = requests.Session(impersonate="chrome131")
          r = s.get(url, headers={"Origin": origin, "Referer": origin + "/"}, timeout=30)
          print("curl_cffi", r.status_code, len(r.content), r.text[:120].replace(os.environ["FEEDJ_ORIGIN"], "<origin>") if r.status_code >= 400 else "")
          PY
      - name: Through the relay
        env:
          GITHUB_ACTIONS: "true"
        run: |
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, urllib.error
          from value_bets.adapters import feedj
          print("relay set:", feedj.relay() is not None)
          api, brand, origin = (os.environ[k] for k in ("FEEDJ_API", "FEEDJ_BRAND", "FEEDJ_ORIGIN"))
          try:
              j = feedj.request(f"{api}/v4/prematch/brand/{brand}/en-IN/0", origin)
              print("relay ok, versions:", len(j.get("rest_events_versions") or []))
              import time
              for v in list(j.get("top_events_versions") or []) + list(j.get("rest_events_versions") or []):
                  time.sleep(1)
                  try:
                      part = feedj.request(f"{api}/v4/prematch/brand/{brand}/en-IN/{v}", origin)
                      print("version", str(v)[-3:], "ok", len(part.get("events") or {}))
                  except urllib.error.HTTPError as e2:
                      print("version", str(v)[-3:], "HTTP", e2.code, e2.read()[:120].decode("utf-8", "replace").replace(origin, "<origin>"))
                  except Exception as e2:
                      print("version", str(v)[-3:], "error", type(e2).__name__, str(e2)[:120])
          except urllib.error.HTTPError as e:
              print("relay HTTP", e.code, e.headers.get("server"), e.headers.get("x-relay-colo"), e.read()[:160].decode("utf-8", "replace").replace(origin, "<origin>"))
          PY
      - name: Feed J run (relay when set)
        env:
          GITHUB_ACTIONS: "true"
        run: python -m value_bets.adapters.feedj | tee -a "$GITHUB_STEP_SUMMARY"
