name: Weekly full re-sync

# Re-reads the complete Base archive so any match a daily run missed (or that Base
# corrected) is repaired. Idempotent: unchanged data produces no commit. Free for public repos.
on:
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:

# Hosts are deployment configuration (repository secrets, masked in logs), never code. See docs/OPERATIONS.md.
env:
  LIVE_SOURCE_BASE: ${{ secrets.LIVE_SOURCE_BASE }}
  LIVE_SITEMAP_DIR: ${{ secrets.LIVE_SITEMAP_DIR }}
  IMG_CDN_BASE: ${{ secrets.IMG_CDN_BASE }}
  VITE_IMG_CDN: ${{ secrets.IMG_CDN_BASE }}
  BASE_DATA_URL: ${{ secrets.BASE_DATA_URL }}
  PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
  EXCHANGE_API_URL: ${{ secrets.EXCHANGE_API_URL }}

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: cricket-data backfill
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Already complete."; else
            git commit -m "data: weekly full re-sync $(date -u +%F)"
            git pull --rebase -q && git push
          fi
      - name: Open an issue if the re-sync failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label heal-failed --state open --json number -q '.[0].number')" ]; then
            gh label create heal-failed --color B60205 2>/dev/null || true
            gh issue create --label heal-failed --title "Weekly full re-sync failed" \
              --body "The weekly Base re-sync failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
