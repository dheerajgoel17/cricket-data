name: Weekly full re-sync

# Re-reads the complete Cricsheet archive so any match a daily run missed (or that Cricsheet
# corrected) is repaired. Idempotent: unchanged data produces no commit. Free for public repos.
on:
  schedule:
    - cron: "15 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: cricket-data backfill
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Already complete."; else
            git commit -m "data: weekly full re-sync $(date -u +%F)"
            git pull --rebase -q && git push
          fi
