name: In-play snapshot

# While a match is on: read the price feed's in-play lines about every 15 s for a minute and keep the latest in Supabase (one row, replaced each time) for api/inplay.js.
# The same run reads this book's live player-runs and team-runs lines once and merges them into that row. Nothing is committed.
# The scheduler Worker starts it every minute (GitHub's own cron is hours late and runs no more often than every 5 minutes, so the schedule below is only the fallback).
# Nothing is committed and the pre-match files are untouched. With nothing in play a run is one read and one write.
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

# Hosts are deployment configuration (repository secrets, masked in logs), never code. See docs/OPERATIONS.md.
env:
  PRICE_FEED_URL: ${{ secrets.PRICE_FEED_URL }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  FEEDI_URL: ${{ secrets.FEEDI_URL }}
  FEEDI_NAME: ${{ secrets.FEEDI_NAME }}
  FEEDI_RELAY: ${{ secrets.FEEDI_RELAY }}
  FEEDI_RELAY_KEY: ${{ secrets.FEEDI_RELAY_KEY }}
  FEEDG_RELAY: ${{ secrets.FEEDG_RELAY }}
  FEEDG_RELAY_KEY: ${{ secrets.FEEDG_RELAY_KEY }}
  FEEDH_RELAY: ${{ secrets.FEEDH_RELAY }}
  FEEDH_RELAY_KEY: ${{ secrets.FEEDH_RELAY_KEY }}

permissions:
  contents: read

concurrency:
  group: inplay
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pyproject.toml
            README.md
            src/value_bets
            src/cricket_data
            scripts/feedi_inplay.py
            site/packages/engine
            site/scripts/inplay-snapshot.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: This book's live lines
        continue-on-error: true
        env:
          FEEDI_DEBUG: "1"
        run: python scripts/feedi_inplay.py > "$RUNNER_TEMP/feedi-inplay.json"
      - name: Snapshot
        env:
          FEEDI_INPLAY_FILE: ${{ runner.temp }}/feedi-inplay.json
        run: node site/scripts/inplay-snapshot.mjs
