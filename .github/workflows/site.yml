name: Site

# Rebuilds the stats site's data hourly (Cricsheet ball-by-ball + provisional matches) and deploys it to Vercel (Hobby, free).
# Runs after "Daily update" finishes, daily as a fallback, on demand, and on PRs that touch the site (build + tests, plus a Vercel *preview*
# deployment whose URL is commented on the PR; only PRs from this repository get one, because fork PRs cannot read the secrets).
# Secrets (repository settings, never printed): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, DATA_WRAP_KEY,
# VITE_GA_MEASUREMENT_ID. Without the Vercel trio the job still builds and tests, then skips the deploy.
# Serverless LLM keys (XAI_API_KEY / GEMINI_API_KEY) stay in Vercel env: see docs/SITE.md.
on:
  workflow_run:
    workflows: ["Daily update"]
    types: [completed]
  schedule:
    - cron: "50 * * * *"  # hourly: picks up the scraper's provisional matches (it commits every 30 min) and fixtures
  workflow_dispatch:
    inputs:
      sync_limit:
        description: "Max images to copy into our own store this run (first backfill: 6000)"
        default: "1500"
  push:
    branches: [main]
    paths: ["site/**", "src/cricket_site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "src/cricket_site/**", "tests/site/**", "scripts/make_site_fixture.py", ".github/workflows/site.yml"]

permissions:
  contents: read
  pull-requests: write  # to comment the preview URL

concurrency:
  group: site-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    # when triggered by workflow_run, only deploy if the data update itself succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATA_WRAP_KEY: ${{ secrets.DATA_WRAP_KEY }}
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: pip install -e .
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: JS tests (engine, resolver, rule parser, API handler, components)
        working-directory: site
        run: npm test
      - name: Type-check and build the site (Vite)
        working-directory: site
        run: npm run build
      - name: Today's date (cache key for the daily-changing downloads)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore today's Cricsheet download and player photos
        id: dl
        uses: actions/cache@v4
        with:
          path: .sitecache
          key: site-dl4-${{ steps.day.outputs.d }}
      - name: Download Cricsheet ball-by-ball and the people register (once a day)
        if: steps.dl.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sitecache
          curl -fsSL --retry 4 --retry-delay 20 -o .sitecache/all_json.zip https://cricsheet.org/downloads/all_json.zip
          curl -fsSL --retry 3 -o .sitecache/people.csv https://cricsheet.org/register/people.csv || echo "::warning::people.csv unavailable, so no player photos"
      - name: Build site data
        run: |
          PEOPLE=""; [ -f .sitecache/people.csv ] && PEOPLE="--people .sitecache/people.csv --photos --crex-cache .sitecache"
          python -m cricket_site.build --zip .sitecache/all_json.zip --data data --out site/public/data --value-bets value_bets/out $PEOPLE --site-url "${{ vars.SITE_URL }}" | tee build.json
          python - <<'PY'
          import json
          from datetime import date
          meta = json.load(open("site/public/data/meta.json"))
          assert meta["matches"] > 20000, f"suspiciously few matches: {meta['matches']}"
          # the scraper's provisional matches cover the gap until Cricsheet publishes, so judge freshness on whichever is newer
          newest = max(meta["newest_cricsheet"], meta.get("newest_provisional") or "")
          age = (date.today() - date.fromisoformat(newest)).days
          print(f"newest Cricsheet match {meta['newest_cricsheet']}, newest provisional {meta.get('newest_provisional')}; provisional {meta['provisional_matches']}")
          if age > 3:
              print("::warning::Neither Cricsheet nor the scraper has data newer than 3 days")
          PY
          du -sh site/public/data
      - name: Keep our own copy of CREX images and id maps (Supabase Storage + Postgres)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_LIMIT: ${{ inputs.sync_limit || '1500' }}
        run: |
          python -m cricket_site.assets_sync --photos site/public/data/photos.json --index site/public/data/crex_index.json --identity site/public/data/identity.json
          rm -f site/public/data/crex_index.json
          python -m cricket_site.wrap --dir site/public/data
      - name: Deploy to Vercel
        if: github.event_name != 'pull_request' && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: site
        run: |
          npx --yes vercel@latest deploy --prod --yes --force --token "$VERCEL_TOKEN" \
            --build-env "VITE_GA_MEASUREMENT_ID=$VITE_GA_MEASUREMENT_ID" \
            --env "DATA_WRAP_KEY=$DATA_WRAP_KEY"
      - name: Deploy preview (pull requests from this repository)
        id: preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: site
        run: |
          URL=$(npx --yes vercel@latest deploy --yes --force --token "$VERCEL_TOKEN" \
            --build-env "VITE_GA_MEASUREMENT_ID=$VITE_GA_MEASUREMENT_ID" \
            --env "DATA_WRAP_KEY=$DATA_WRAP_KEY" | tail -n 1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the preview URL on the PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Preview of ${SHA:0:7}: $PREVIEW_URL (if it asks you to log in, sign in to the Vercel account that owns the project)"
      - name: Deploy skipped
        if: env.VERCEL_PROJECT_ID == '' || (github.event_name == 'pull_request' && steps.preview.outcome == 'skipped')
        run: echo "::notice::Built and tested; not deployed (fork pull request, or the VERCEL_* secrets are not set)."
