name: Site

# Rebuilds the stats site's data hourly (Cricsheet ball-by-ball + provisional matches) and deploys it to Vercel (Hobby, free).
# Runs after "Daily update" finishes, daily as a fallback, on demand, and (build + tests only, no deploy) on PRs that touch the site.
# Secrets (repository settings, never printed): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Without them the job still builds and
# tests, then skips the deploy. GEMINI_API_KEY is a *Vercel* project environment variable, not a GitHub secret: see docs/SITE.md.
on:
  workflow_run:
    workflows: ["Daily update"]
    types: [completed]
  schedule:
    - cron: "50 * * * *"  # hourly: picks up the scraper's provisional matches (it commits every 30 min) and fixtures
  workflow_dispatch:
    inputs:
      sync_limit:
        description: "Max images to copy into our own store this run (first backfill: 6000)"
        default: "1500"
  push:
    branches: [main]
    paths: ["site/**", "src/cricket_site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "src/cricket_site/**", "tests/site/**", "scripts/make_site_fixture.py", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    # when triggered by workflow_run, only deploy if the data update itself succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: pip install -e .
      - name: JS tests (engine, resolver, rule parser, API handler)
        working-directory: site
        run: npm test
      - name: Today's date (cache key for the daily-changing downloads)
        id: day
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore today's Cricsheet download and player photos
        id: dl
        uses: actions/cache@v4
        with:
          path: .sitecache
          key: site-dl2-${{ steps.day.outputs.d }}
      - name: Download Cricsheet ball-by-ball and the people register (once a day)
        if: steps.dl.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sitecache
          curl -fsSL --retry 4 --retry-delay 20 -o .sitecache/all_json.zip https://cricsheet.org/downloads/all_json.zip
          curl -fsSL --retry 3 -o .sitecache/people.csv https://cricsheet.org/register/people.csv || echo "::warning::people.csv unavailable, so no player photos"
      - name: Build site data
        run: |
          PEOPLE=""; [ -f .sitecache/people.csv ] && PEOPLE="--people .sitecache/people.csv"
          PHOTOS=""; [ -n "$PEOPLE" ] && [ ! -f .sitecache/photos.json ] && PHOTOS="--photos"
          python -m cricket_site.build --zip .sitecache/all_json.zip --data data --out site/public/data --value-bets value_bets/out $PEOPLE $PHOTOS --site-url "${{ vars.SITE_URL }}" | tee build.json
          if [ -f site/public/data/photos.json ] && [ ! -f .sitecache/photos.json ]; then cp site/public/data/photos.json .sitecache/photos.json; fi
          if [ -f .sitecache/photos.json ] && [ ! -f site/public/data/photos.json ]; then cp .sitecache/photos.json site/public/data/photos.json; fi
          python - <<'PY'
          import json
          from datetime import date
          meta = json.load(open("site/public/data/meta.json"))
          assert meta["matches"] > 20000, f"suspiciously few matches: {meta['matches']}"
          age = (date.today() - date.fromisoformat(meta["newest_cricsheet"])).days
          print(f"newest Cricsheet match {meta['newest_cricsheet']} ({age} days old); provisional {meta['provisional_matches']}")
          if age > 3:
              print("::warning::Cricsheet data on the site is more than 3 days old")
          PY
          du -sh site/public/data
      - name: Keep our own copy of CREX images and id maps (Supabase Storage + Postgres)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SYNC_LIMIT: ${{ inputs.sync_limit || '1500' }}
        run: |
          python -m cricket_site.assets_sync --photos site/public/data/photos.json --index site/public/data/crex_index.json
          rm -f site/public/data/crex_index.json
      - name: Deploy to Vercel
        if: github.event_name != 'pull_request' && env.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: site
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
      - name: Deploy skipped
        if: github.event_name == 'pull_request' || env.VERCEL_PROJECT_ID == ''
        run: echo "::notice::Built and tested; not deployed (pull request, or VERCEL_* secrets are not set)."
