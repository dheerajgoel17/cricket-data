<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        var t = "dark";
        try {
          var s = localStorage.getItem("fc-theme");
          if (s === "light" || s === "dark") t = s;
          else if (s === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } catch (e) {}
        document.documentElement.classList.toggle("dark", t === "dark");
        if (document.body) document.body.classList.toggle("dark", t === "dark");
        document.documentElement.style.colorScheme = t;
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) m.setAttribute("content", t);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--seo-head-->
    <meta name="theme-color" content="#27da8e" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Fancy.cash" />
    <meta name="apple-mobile-web-app-title" content="Fancy.cash" />
  </head>
  <body>
    <div id="root"><!--seo-body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
