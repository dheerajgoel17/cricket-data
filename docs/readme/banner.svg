  <rect width="1200" height="500" rx="30" fill="url(#base)"/>
  <rect x="1" y="1" width="1198" height="498" rx="29" fill="none" stroke="#315845" stroke-width="2"/>
  <rect x="690" y="45" width="450" height="410" rx="24" fill="url(#grid)"/>
  <ellipse cx="915" cy="238" rx="265" ry="227" fill="url(#glow)"/>
  <g transform="translate(917 245) rotate(-19)" fill="none">
