    <ellipse rx="112" ry="87" stroke="#78ecc0" stroke-opacity=".5" stroke-width="2" stroke-dasharray="4 7"/>
    <rect x="-22" y="-59" width="44" height="118" rx="5" fill="#27da8e" fill-opacity=".15" stroke="#7ef3bd" stroke-width="2"/>
    <path d="M-33 -42h66m-66 84h66M-9 -48v-10m9 10v-10m9 10v-10M-9 48v10m9-10v10m9-10v10" stroke="#a1f8cc" stroke-width="2" stroke-linecap="round"/>
